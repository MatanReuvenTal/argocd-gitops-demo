apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io/delete-resources
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.10.1

    helm:
      values: |
        controller:
          replicaCount: 2
          
          service:
            type: NodePort

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true